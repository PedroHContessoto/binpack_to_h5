[package]
name = "binpack_to_h5"
version = "0.1.0"
edition = "2021"
description = "Convert Stockfish binpack to HDF5 sparse_v1 (HalfP white-POV)"
license = "MIT"

[dependencies]
sfbinpack = "0.6.2"
# hdf5-metno: actively maintained fork of hdf5-rust. The `static` feature
# bundles HDF5 (requires CMake). Works out-of-the-box on Linux; on Windows
# requires MSVC build tools + CMake (winget install Kitware.CMake).
hdf5-metno = { version = "0.10", features = ["static"] }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
anyhow = "1"
crossbeam-channel = "0.5"
num_cpus = "1"

# Optimizations
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bin]]
name = "binpack_to_h5"
path = "src/main.rs"
